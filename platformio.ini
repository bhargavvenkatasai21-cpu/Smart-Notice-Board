[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions.csv
board_build.flash_size = 4MB

; build_flags = -Os
build_flags = -Os -DCORE_DEBUG_LEVEL=5

extra_scripts =
    pre:tools/require_ap_password.py
    pre:tools/set_firmware_version.py

lib_deps =
    arduino-libraries/LiquidCrystal
    bblanchon/ArduinoJson
    links2004/WebSockets